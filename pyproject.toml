[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "opsforge"
version = "1.0.0"
description = "Local-first batch ops command generator: pick servers, write templated commands, get per-host scripts"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "cryptography>=42",
]

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "playwright>=1.46",
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.6",
]

[project.scripts]
opsforge = "ops_gui:main"

[tool.setuptools]
py-modules = ["ops_gui"]

[tool.setuptools.packages.find]
include = ["ops*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
